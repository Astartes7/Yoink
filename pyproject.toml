[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoink"
version = "1.1.0"
description = "A calm desktop media downloader powered by yt-dlp."
requires-python = ">=3.11"
dependencies = [
  "customtkinter>=5.2",
  "imageio-ffmpeg>=0.5",
  "platformdirs>=4",
  "Pillow>=10",
  "yt-dlp[default]>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yoink = "yoink.ui.app:run"

[tool.setuptools.packages.find]
include = ["yoink*"]

[tool.setuptools.package-data]
yoink = ["assets/**/*", "themes/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
